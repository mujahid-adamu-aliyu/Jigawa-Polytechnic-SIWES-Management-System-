async function submitLogbookEntry(week, btn){
  const ta = document.getElementById('logEntryText')
  const text = (ta?.value || '').trim()
  if (!text){ fieldInvalid('logEntryText','logEntryTextErr', true); ta?.focus(); return }
  const ok = await showConfirm('Submit Week ' + week, 'Submit this entry? Once submitted it is locked and cannot be edited or deleted.', 'Submit', 'no-sheet')
  if (!ok) return
  setBtnLoading(btn, true)
  try {
    const { error } = await supabase.from('logbook_entries')
      .insert({ student_id: currentStudentId, week_number: week, entry_text: text })
    if (error) throw error
    showToast('success', `Week ${week} entry submitted.`)
    await loadLogbook()
    loadStatus()
  } catch (err){
    handleErr(err, 'Could not submit your logbook entry')
  } finally { setBtnLoading(btn, false) }
}

/* =============== DOCUMENTS (Stage 3) =============== */
const DOC_CATEGORIES = [
  { type:'placement_letter',      label:'Placement Letter',       icon:'ph-file-text',
    exts:['pdf','doc','docx'], accept:'.pdf,.doc,.docx', maxBytes:10*1024*1024, maxLabel:'10MB' },
  { type:'id_card',               label:'ID Card',                icon:'ph-identification-card',
    exts:['jpg','jpeg','png','pdf'], accept:'.jpg,.jpeg,.png,.pdf', maxBytes:5*1024*1024, maxLabel:'5MB' },
  { type:'passport_photo',        label:'Passport Photo',         icon:'ph-image',
    exts:['jpg','jpeg','png'], accept:'.jpg,.jpeg,.png', maxBytes:2*1024*1024, maxLabel:'2MB' },
  { type:'introduction_letter',   label:'Introduction Letter',    icon:'ph-envelope-open',
    exts:['pdf','doc','docx'], accept:'.pdf,.doc,.docx', maxBytes:10*1024*1024, maxLabel:'10MB' },
  { type:'insurance_form',        label:'Insurance Form',         icon:'ph-shield-check',
    exts:['pdf','doc','docx'], accept:'.pdf,.doc,.docx', maxBytes:10*1024*1024, maxLabel:'10MB' },
]
const DOC_CATEGORY_BY_TYPE = Object.fromEntries(DOC_CATEGORIES.map(c => [c.type, c]))
const STORAGE_BUCKET = 'student-documents'
let __pendingUploadType = null

async function loadDocuments(){
  const host = document.getElementById('documentsRoot')
  if (!host || !currentStudentId) return
  host.innerHTML = `<div class="doc-grid">${skCards(5)}</div>`
  try {
    const [
      { data, error },
      { data: placement, error: plcErr },
    ] = await Promise.all([
      supabase.from('documents')
        .select('file_type, file_url, file_name, uploaded_at').eq('student_id', currentStudentId),
      supabase.from('placements').select('id, status')
        .eq('student_id', currentStudentId).order('created_at', { ascending:false }).limit(1).maybeSingle(),
    ])
    if (error) throw error
    if (plcErr) throw plcErr
    const byType = {}
    ;(data || []).forEach(d => { byType[d.file_type] = d })
    // Placement Letter (Change Set 2) unlocks once the student has any placement
    // row at all (pending or later) — i.e. once they've selected an organization.
    const hasPlacement = !!placement

    host.innerHTML = `<div class="doc-grid">${DOC_CATEGORIES.map(cat => {
      const doc = byType[cat.type]
      const uploaded = !!doc
      const isPlacementLetter = cat.type === 'placement_letter'
      const locked = isPlacementLetter && !hasPlacement
      return `<div class="doc-card${uploaded ? ' is-uploaded' : ''}${locked ? ' locked' : ''}">
        <div class="doc-card-head">
          <div class="doc-icon"><i class="ph-bold ${cat.icon}"></i></div>
          <div style="min-width:0">
            <div class="doc-card-name">${escHtml(cat.label)}</div>
            <div class="doc-card-status${uploaded ? ' uploaded' : ''}">
              <i class="ph-bold ${uploaded ? 'ph-check-circle' : 'ph-clock'}"></i>
              ${uploaded ? 'Uploaded ' + formatDate(doc.uploaded_at) : 'Not uploaded yet'}
            </div>
          </div>
        </div>
        ${uploaded ? `<div class="doc-card-file"><i class="ph ph-paperclip"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(doc.file_name || 'file')}</span></div>` : ''}
        ${locked ? `<div class="doc-card-lock-caption"><i class="ph-bold ph-lock-simple"></i>Unlocks after you select an organization</div>` : ''}
        <button class="btn-secondary btn" style="width:100%;justify-content:center" data-doc-type="${cat.type}" data-doc-label="${escHtml(cat.label)}" ${locked ? 'disabled' : ''}>
          <i class="ph-bold ${uploaded ? 'ph-arrows-clockwise' : 'ph-upload-simple'} btn-icon"></i>
          <span class="btn-text">${uploaded ? 'Replace' : 'Upload'}</span>
          <span class="btn-dots"><span></span><span></span><span></span></span>
        </button>
      </div>`
    }).join('')}</div>`

    host.querySelectorAll('[data-doc-type]:not([disabled])').forEach(btn => {
      btn.addEventListener('click', () => triggerDocUpload(btn.dataset.docType, btn.dataset.docLabel, btn))
    })
  } catch (err){
    handleErr(err, 'Could not load your documents')
    host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Could not load your documents.</div>`
  }
}

function triggerDocUpload(fileType, label, btn){
  __pendingUploadType = { fileType, label, btn }
  const input = document.getElementById('docFileInput')
  const cat = DOC_CATEGORY_BY_TYPE[fileType]
  input.accept = cat ? cat.accept : ''
  input.value = ''
  input.onchange = () => {
    const file = input.files && input.files[0]
    if (file) uploadDocument(file)
  }
  input.click()
}

function formatBytes(bytes){
  if (!bytes && bytes !== 0) return '—'
  const mb = bytes / (1024*1024)
  return mb >= 1 ? mb.toFixed(1) + 'MB' : Math.max(1, Math.round(bytes/1024)) + 'KB'
}

/* Stylish on-brand violation dialog for upload rule breaks — reuses the
   modal-card/modal-backdrop system, distinct from showInfoModal via a
   colored warning icon header. Never proceeds with any upload on trigger. */
function showUploadViolationModal(title, message){
  const bd = document.createElement('div')
  bd.className = 'modal-backdrop'
  bd.innerHTML = `
    <div class="modal-card no-sheet">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:6px">
        <div style="width:56px;height:56px;border-radius:50%;background:rgba(239,68,68,0.12);border:1.5px solid rgba(239,68,68,0.25);color:var(--error);display:flex;align-items:center;justify-content:center;font-size:28px">
          <i class="ph-bold ph-warning-circle"></i>
        </div>
        <div class="modal-title" style="margin-bottom:0">${escHtml(title)}</div>
      </div>
      <div class="modal-msg" style="text-align:center">${escHtml(message)}</div>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn-primary" data-act="close">Got it</button>
      </div>
    </div>`
  document.body.appendChild(bd)
  const close = () => bd.remove()
  bd.addEventListener('click', e => { if (e.target === bd) close() })
  bd.querySelector('[data-act="close"]').addEventListener('click', close)
}

async function uploadDocument(file){
  const pending = __pendingUploadType
  if (!pending || !currentStudentId) return
  const { fileType, label, btn } = pending
  const cat = DOC_CATEGORY_BY_TYPE[fileType]

  // Validate extension AND size in JS — the input's accept attribute is a
  // convenience filter for the OS picker only and can be bypassed (drag-drop,
  // "All Files" override, etc.), so it is never trusted alone.
  const ext = (file.name.split('.').pop() || '').toLowerCase()
  if (cat && !cat.exts.includes(ext)){
    __pendingUploadType = null
    const allowed = cat.exts.map(e => e.toUpperCase()).join(', ')
    showUploadViolationModal(
      'Unsupported file type',
      `${label} must be one of: ${allowed}. The file you picked is a .${ext || '?'} file.`
    )
    return
  }
  if (cat && file.size > cat.maxBytes){
    __pendingUploadType = null
    showUploadViolationModal(
      'File too large',
      `${label} must be under ${cat.maxLabel}. Your file is ${formatBytes(file.size)}.`
    )
    return
  }

  setBtnLoading(btn, true)
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_')
    const path = `${currentStudentId}/${fileType}/${Date.now()}_${safeName}`
    const { error: upErr } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, { upsert: true })
    if (upErr) throw upErr
    const { data: pub } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path)
    const fileUrl = pub?.publicUrl || path

    const { error: dbErr } = await supabase.from('documents')
      .upsert({
        student_id: currentStudentId,
        file_type: fileType,
        file_url: fileUrl,
        file_name: file.name,
        uploaded_at: new Date().toISOString(),
      }, { onConflict: 'student_id,file_type' })
    if (dbErr) throw dbErr

    showToast('success', `${label} uploaded.`)
    await loadDocuments()
    loadStatus()
  } catch (err){
    handleErr(err, 'Could not upload your document')
  } finally {
    setBtnLoading(btn, false)
    __pendingUploadType = null
  }
}

/* =============== ANNOUNCEMENTS (Stage 3) =============== */
async function loadAnnouncements(){
  const host = document.getElementById('announcementsRoot')
  if (!host || !currentStudentId) return
  host.innerHTML = skCards(4)
  try {
    const { data, error } = await supabase.from('announcements')
      .select('id, title, body, created_at').order('created_at', { ascending:false })
    if (error) throw error

    if (!data || data.length === 0){
      host.innerHTML = `<div class="state-box"><i class="ph ph-megaphone"></i>No announcements yet. Check back later.</div>`

          <div class="annc-title"><i class="ph-bold ph-megaphone"></i>${escHtml(a.title)}</div>
          <div class="annc-date">${formatDateTime(a.created_at)}</div>
        </div>
        <div class="annc-body">${escHtml(a.body)}</div>
      </div>`).join('')}</div>`
  } catch (err){
    handleErr(err, 'Could not load announcements')
    host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Could not load announcements.</div>`
  }
}

/* =============== GRADE (Stage 3) =============== */
const GRADE_CLASS_CSS = {
  'Excellent':'gb-excellent', 'Very Good':'gb-very-good', 'Good':'gb-good',
  'Fair':'gb-fair', 'Poor':'gb-poor',
}
const RUBRIC_FIELDS = [
  { key:'punctuality_score', max:15, label:'Punctuality & Attendance' },
  { key:'logbook_score',     max:20, label:'Logbook Quality' },
  { key:'skill_score',       max:30, label:'Practical Skill / Performance' },
  { key:'conduct_score',     max:15, label:'Conduct & Discipline' },
  { key:'initiative_score',  max:10, label:'Initiative & Attentiveness' },
  { key:'visits_score',      max:10, label:"Supervisor's Overall Visit Impression" },
]

async function loadGrade(){
  const host = document.getElementById('gradeRoot')
  if (!host || !currentStudentId) return
  host.innerHTML = skCards(3)
  try {
    const { data: grade, error } = await supabase.from('grades')
      .select('*').eq('student_id', currentStudentId).maybeSingle()
    if (error) throw error

    if (!grade){
      host.innerHTML = `<div class="state-box"><i class="ph ph-medal"></i>Your grade will appear here once your supervisor submits it.</div>`
      return
    }

    const badgeCls = GRADE_CLASS_CSS[grade.classification] || 'gb-good'
    host.innerHTML = `
      <div class="grade-total-card">
        <div>
          <div class="grade-total-value">${Number(grade.total_score ?? 0)}<span style="font-size:18px;color:var(--text-muted);font-weight:600">/100</span></div>
          <div class="grade-total-label">Total Score</div>
        </div>
        <span class="grade-badge ${badgeCls}">${escHtml(grade.classification || '—')}</span>
      </div>
      <div class="rubric-grid">${RUBRIC_FIELDS.map(f => {
        const v = Number(grade[f.key] ?? 0)
        const pct = Math.max(0, Math.min(100, (v / f.max) * 100))
        return `<div class="rubric-card">
          <div class="rubric-label">${escHtml(f.label)}</div>
          <div class="rubric-score-row"><span class="rubric-score">${v}</span><span class="rubric-max">/ ${f.max}</span></div>
          <div class="rubric-bar-track"><div class="rubric-bar-fill" style="width:${pct}%"></div></div>
        </div>`
      }).join('')}</div>
      <div class="grade-note-card">
        <div class="grade-note-label">Supervisor's Assessment Note</div>
        <div class="grade-note-text">${escHtml(grade.assessment_note || '')}</div>
      </div>`
  } catch (err){
    handleErr(err, 'Could not load your grade')
    host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Could not load your grade.</div>`
  }
}

/* =============== AUTH =============== */
async function confirmLogout(){
  const ok = await showConfirm('Log Out', "Are you sure you want to log out? You'll need to sign in again to access the dashboard.", 'Log Out', 'no-sheet')
  if (ok) doLogout()
}
async function doLogout(){ await supabase.auth.signOut(); window.location.href='index.html' }

/* =============== INIT =============== */
async function init(){
  renderNav()
  try {
    // Falls back silently to the default 'status' tab if a returning user has a
    // stale/removed tab name saved (e.g. the old 'organization' tab).
    const savedTab = localStorage.getItem('siwes-student-tab')
    if (savedTab && document.getElementById('page-'+savedTab)) switchTab(savedTab)
  } catch(e){}
  initMedBg()
  document.getElementById('menuBtn').addEventListener('click', openDrawer)
  document.getElementById('drawerClose').addEventListener('click', closeDrawer)
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer)
  document.getElementById('logoutBtn').addEventListener('click', confirmLogout)
  document.getElementById('logoutBtnDrawer').addEventListener('click', confirmLogout)

  const { data: { session } } = await supabase.auth.getSession()
  if (!session){
    // If Google Sign-In was blocked (e.g. our DB trigger rejected an unregistered
    // account), Supabase still redirects here but with no session — instead it
    // reports the failure via hash params (#error=...&error_description=...).
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''))
    const oauthErr = hashParams.get('error')
    if (oauthErr){
      history.replaceState(null, '', window.location.pathname)
      const desc = hashParams.get('error_description') || ''
      const reason = /not_registered/i.test(desc) ? 'not_registered' : 'oauth_failed'
      showAccessDeniedModal(reason)
      return
    }
    window.location.href='index.html'
    return
  }
  currentUser = session.user

  // SIWES schema: role, full_name and must_change_password live on the profiles table.
  // maybeSingle() so a missing profile row resolves to null instead of throwing.
  const { data: profile, error: profileErr } = await supabase
    .from('profiles').select('role, full_name, must_change_password').eq('id', currentUser.id).maybeSingle()
  if (profileErr || !profile){
    // No profile row at all — this Google account was never registered.
    showAccessDeniedModal('not_registered')
    return
  }
  if (profile.role !== 'student'){
    // Has a profile, but it belongs to a supervisor/admin — this page is students-only.
    showAccessDeniedModal('wrong_role')
    return
  }
  if (profile.must_change_password){
    // The auth page (index.html) owns the must-change-password modal flow; keep the
    // session intact and bounce back so it can prompt for a new password there.
    window.location.href='index.html'
    return
  }

  // students.id is the same uuid as profiles.id (both reference auth.users).
  currentStudentId = currentUser.id
  setWelcomeMessages(profile.full_name); setupIslandProfile(profile.full_name)

  document.getElementById('authScreen').style.display='none'
  document.getElementById('app').style.display='block'
  updateMainTopOffset()

  document.getElementById('refreshStatusBtn').addEventListener('click', async e => {
    spinBtn(e.currentTarget)
    const host = document.getElementById('page-status')
    const hasContent = host && host.querySelector('.status-hero, .ac-card')
    if (hasContent) host.classList.add('refresh-host','refreshing')
    try {
      await loadStatus()
      showToast('info', 'Status refreshed.')
    } finally { if (host) host.classList.remove('refreshing') }
  })
  document.getElementById('refreshLogbookBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('logbookRoot', loadLogbook, 'Logbook') })
  document.getElementById('refreshDocumentsBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('documentsRoot', loadDocuments, 'Documents') })
  document.getElementById('refreshAnnouncementsBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('announcementsRoot', loadAnnouncements, 'Announcements') })
  document.getElementById('refreshGradeBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('gradeRoot', loadGrade, 'Grade') })

  loadStatus()
  checkUnreadAnnouncements()
  // Other tabs load on first open, then refresh each time they're revisited.
  if (document.getElementById('page-logbook').classList.contains('active')) loadLogbook()
  if (document.getElementById('page-documents').classList.contains('active')) loadDocuments()
  if (document.getElementById('page-announcements').classList.contains('active')){ loadAnnouncements(); markAnnouncementsRead() }
  if (document.getElementById('page-grade').classList.contains('active')) loadGrade()
}

/* =============== HOVER + ARROW-KEY SCROLL =============== */
;(function setupHoverArrowScroll(){
  const SCROLL_STEP = 80
  let hoveredPanel = null
  const navScrollEl = () => document.getElementById('islandNavList')
  const navHoverTarget = document.getElementById('islandNav')
  const mainHoverTarget = document.querySelector('main.main')

  if (navHoverTarget){
    navHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'nav' })
    navHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'nav') hoveredPanel = null })
    navHoverTarget.addEventListener('wheel', (e) => {
      const scrollEl = navScrollEl()
      if (!scrollEl) return
      scrollEl.scrollTop += e.deltaY
      e.preventDefault()
    }, { passive:false })
  }
  if (mainHoverTarget){
    mainHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'main' })
    mainHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'main') hoveredPanel = null })
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return
    if (!hoveredPanel) return
    const tag = (document.activeElement && document.activeElement.tagName) || ''
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return
    const delta = e.key === 'ArrowDown' ? SCROLL_STEP : -SCROLL_STEP
    if (hoveredPanel === 'nav' && navScrollEl()){
      navScrollEl().scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    } else if (hoveredPanel === 'main'){
      window.scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    }
  })
})()

init()
</script>
