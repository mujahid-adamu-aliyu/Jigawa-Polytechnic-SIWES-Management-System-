<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jigawa State Polytechnic — SIWES Supervisor Dashboard</title>
<link rel="icon" type="image/png" href="assets/jsp-logo.png" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2/src/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#1B8FCB; --primary-mid:#2CA1DE; --primary-light:#4FB3E8;
  --bg:#F4F5F6; --panel-bg:#FFFFFF; --neu-bg:#FFFFFF;
  --neu-shadow-d:#d6dade; --neu-shadow-l:#ffffff;
  --text:#1E2528; --text-muted:#6B7378;
  --input-bg:#FFFFFF; --input-border:#D3D7DA; --input-bg-err:#FEF2F2;
  --card-border:rgba(30,37,40,0.14); --card-border-solid:#D3D7DA;
  --success:#16A34A; --error:#EF4444; --warning:#F59E0B; --info:#2563EB; --white:#FFFFFF;
  --shadow-rgb:27,143,203;
  --radius-card:12px; --radius-input:8px; --radius-btn:8px;
  --overlay-grad:linear-gradient(150deg,#2CA1DE 0%,#1B8FCB 100%);
  --brand-grad:linear-gradient(135deg,#8A96A0 0%,#1B8FCB 100%);
  --content-max:1200px;
  --med-icon:rgba(27,143,203,0.22);
  --stat-amber:#F59E0B; --stat-blue:#2563EB;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
.drawer-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;transition:background 250ms ease,color 250ms ease}
body{overflow-x:hidden;overscroll-behavior-y:none}
.blob{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none}
.blob1{width:500px;height:500px;background:rgba(27,143,203,0.12);top:-150px;left:-150px;animation:blobDrift1 22s ease-in-out infinite alternate}
.blob2{width:420px;height:420px;background:rgba(var(--shadow-rgb),0.10);bottom:-120px;right:-120px;filter:blur(80px);animation:blobDrift2 18s ease-in-out infinite alternate}
@keyframes blobDrift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,80px) scale(1.15)}}
@keyframes blobDrift2{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-100px,-60px) scale(1)}}

/* SIWES-themed snow background */
.med-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.med-bg i{position:absolute;color:var(--med-icon);font-size:26px;top:-40px;animation:medFall linear infinite;opacity:.9}
@keyframes medFall{
  0%{transform:translateY(-40px) rotate(0deg);opacity:0}
  10%{opacity:.9}
  90%{opacity:.9}
  100%{transform:translateY(105vh) rotate(360deg);opacity:0}
}
@media print{
  .med-bg,.blob{display:none !important}
}

#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;font-size:16px;color:var(--text-muted);gap:14px;position:relative;z-index:1;padding:20px;text-align:center}
#authScreen .auth-logo-pulse{animation:authLogoPulse 0.85s cubic-bezier(0.45,0,0.55,1) infinite}
#authScreen img{width:64px;height:64px;border-radius:14px;box-shadow:0 6px 20px rgba(var(--shadow-rgb),0.35)}
@keyframes authLogoPulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 0.8s linear infinite}

.layout{position:relative;z-index:1}
.topbar-shell{position:fixed;top:0;left:0;right:0;z-index:90;max-width:var(--content-max);margin:12px auto 0;padding-inline:clamp(64px,10vw,120px);pointer-events:none}
@media(min-width:769px){
  .topbar-shell{max-width:none;margin:14px 16px 0;padding-inline:0}
}
.topbar{position:relative;width:100%;padding:10px 20px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.12);display:flex;align-items:center;gap:14px;pointer-events:auto;transition:box-shadow 260ms ease}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:42px;height:42px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.35);border:2.5px solid #1B8FCB;color:#fff;font-size:22px;overflow:hidden;flex-shrink:0}
.brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
.brand-name{font-weight:800;font-size:15px;color:var(--text);line-height:1.1;letter-spacing:.01em}
.brand-kicker{font-weight:700;font-size:10px;color:var(--primary-mid);text-transform:uppercase;letter-spacing:0.12em;margin-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid var(--card-border-solid);background:var(--neu-bg);color:var(--text);cursor:pointer;font-size:18px;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.icon-btn:hover{transform:translateY(-2px) scale(1.08);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.18);border-color:var(--primary)}
.icon-btn:active{transform:translateY(0) scale(0.95)}
.icon-btn i{transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1)}
.icon-btn:hover i{transform:rotate(-8deg)}
.logout-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);font:600 13px 'Inter';cursor:pointer;transition:all 180ms ease}
.logout-btn:hover{background:rgba(239,68,68,0.18)}
.desktop-logout-btn{display:inline-flex}
@media(max-width:768px){.desktop-logout-btn{display:none}}
.hamburger{display:none}

.topnav-strip-wrapper{position:fixed;top:78px;z-index:89;left:0;right:0;max-width:var(--content-max);margin:14px auto 0;padding-inline:clamp(64px,10vw,120px);pointer-events:none}
.topnav-strip-outer{padding:14px 16px;background:color-mix(in srgb, var(--panel-bg) 78%, transparent);backdrop-filter:blur(14px) saturate(160%);border:1.5px solid var(--card-border-solid);border-radius:24px;box-shadow:0 8px 24px rgba(var(--shadow-rgb),0.08);pointer-events:auto}
.topnav-strip{display:grid;grid-template-columns:repeat(1,1fr);gap:10px}
.nav-item{display:flex;align-items:center;justify-content:center;gap:9px;padding:0 16px;min-height:44px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:999px;color:var(--text-muted);font:700 13px 'Inter',sans-serif;opacity:.6;cursor:pointer;transition:all 200ms ease}
.nav-item i{font-size:18px}
.nav-item:hover{opacity:.9;transform:translateY(-1px)}
.nav-item.active{color:#fff;border-color:transparent;background:var(--brand-grad);box-shadow:0 6px 20px rgba(var(--shadow-rgb),0.40);opacity:1}

/* ===================== DESKTOP ISLAND SIDEBAR ===================== */
@media(min-width:769px){
  .topnav-strip-wrapper{display:none !important}
}
:root{ --island-w-collapsed:68px; --island-w-expanded:250px; }
.island-nav{
  display:none;
  position:fixed; top:var(--main-top-offset,90px); bottom:12px; left:16px; z-index:88;
  width:var(--island-w-expanded);
  background:color-mix(in srgb, var(--panel-bg) 86%, transparent);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1.5px solid var(--card-border-solid); border-radius:var(--radius-card);
  box-shadow:0 10px 28px rgba(var(--shadow-rgb),0.14);
  flex-direction:column; overflow:hidden;
  transition:box-shadow 260ms ease;
}
@media(min-width:769px){ .island-nav{ display:flex } }
.island-label{ display:inline-block; opacity:1; }

.island-profile{ display:flex; align-items:center; gap:10px; padding:10px 14px 16px; flex-shrink:0; min-width:0; cursor:default; transition:transform 220ms ease }
.island-profile:hover{ transform:translateX(2px) }
.island-avatar{
  width:38px; height:38px; border-radius:50%; background:var(--brand-grad); color:#fff;
  display:flex; align-items:center; justify-content:center; font:800 14px 'Inter',sans-serif;
  flex-shrink:0; box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.30);
  transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 260ms ease;
}
.island-avatar i{ font-size:18px; }
.island-profile:hover .island-avatar{ transform:scale(1.08) rotate(-4deg); box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.45) }
.island-profile-meta{ min-width:0; overflow:hidden }
.island-profile-name{ font:700 13.5px 'Inter',sans-serif; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.island-profile-badge{
  display:inline-block; margin-top:3px; font:700 10px 'Inter',sans-serif; text-transform:uppercase; letter-spacing:.06em;
  color:var(--primary); background:rgba(var(--shadow-rgb),0.10); border-radius:999px; padding:2px 8px; white-space:nowrap;
  transition:background 220ms ease, letter-spacing 220ms ease;
}
.island-profile:hover .island-profile-badge{ background:rgba(var(--shadow-rgb),0.18); letter-spacing:.09em }

.island-divider{ height:1px; background:var(--card-border-solid); margin:0 14px; flex-shrink:0; opacity:.7 }

.island-nav-list{ flex:1; display:flex; flex-direction:column; gap:6px; padding:14px 10px; overflow-y:auto; overflow-x:hidden; min-height:0; scrollbar-width:none }
.island-nav-list::-webkit-scrollbar{ display:none }
.island-nav-item{
  position:relative; display:flex; align-items:center; gap:12px; min-height:44px;
  border-radius:14px; padding:0 13px; color:var(--text-muted); background:transparent; border:none;
  cursor:pointer; font:700 13px 'Inter',sans-serif; transition:background 220ms ease, color 220ms ease, transform 220ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 220ms ease;
  text-align:left; width:100%; justify-content:flex-start;
  opacity:0; transform:translateX(-10px); animation:islandItemIn 420ms ease forwards;
}
@keyframes islandItemIn{ to{ opacity:1; transform:translateX(0) } }
.island-nav-item:nth-child(1){ animation-delay:40ms }
.island-nav-item:nth-child(2){ animation-delay:80ms }
.island-nav-item:nth-child(3){ animation-delay:120ms }
.island-nav-item:nth-child(4){ animation-delay:160ms }
.island-nav-item:nth-child(5){ animation-delay:200ms }
.island-nav-item:nth-child(6){ animation-delay:240ms }
.island-nav-item:nth-child(7){ animation-delay:280ms }
.island-nav-item:nth-child(8){ animation-delay:320ms }
.island-nav-item i{ font-size:19px; flex-shrink:0; width:22px; text-align:center; transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1) }
.island-nav-item:hover{ background:rgba(var(--shadow-rgb),0.08); color:var(--text); transform:translateX(4px) }
.island-nav-item:hover i{ transform:scale(1.15) rotate(-6deg) }
.island-nav-item:active{ transform:translateX(4px) scale(0.97) }
.island-nav-item.active{ background:rgba(var(--shadow-rgb),0.12); color:var(--primary); box-shadow:0 2px 10px rgba(var(--shadow-rgb),0.10) }
.island-nav-item.active::before{
  content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:4px; border-radius:0 4px 4px 0; background:var(--brand-grad);
  transition:top 260ms cubic-bezier(0.34,1.56,0.64,1), bottom 260ms cubic-bezier(0.34,1.56,0.64,1);
}
.island-nav-item:focus-visible{ outline:2px solid var(--primary); outline-offset:2px }

.island-footer{ flex-shrink:0; padding:14px; display:flex; align-items:center; gap:10px; min-width:0; cursor:default; transition:transform 220ms ease }
.island-footer:hover{ transform:translateX(2px) }
.island-footer-glyph{
  width:30px; height:30px; border-radius:9px; background:rgba(var(--shadow-rgb),0.10); color:var(--primary);
  display:flex; align-items:center; justify-content:center; font:800 11px 'Inter',sans-serif; flex-shrink:0;
  transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1);
}
.island-footer-glyph i{font-size:16px}
.island-footer:hover .island-footer-glyph{ transform:scale(1.08) rotate(4deg) }
.island-footer-lines{ min-width:0; overflow:hidden }
.island-footer-lines div{ font-size:10.5px; line-height:1.5; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.island-footer-lines div:first-child{ font-weight:700; color:var(--text) }
@media (prefers-reduced-motion:reduce){
  .island-nav-item{ opacity:1; transform:none; animation:none }
  .island-profile, .island-footer, .island-avatar, .island-footer-glyph, .island-profile-badge, .island-nav-item i{ transition:none }
}

.main{max-width:var(--content-max);margin:0 auto 60px;padding:clamp(24px,5vw,60px) clamp(64px,10vw,120px);padding-top:var(--main-top-offset,200px);position:relative;z-index:1}
@media(min-width:769px){ .main{ max-width:none; padding-left:calc(16px + var(--island-w-expanded) + 24px); padding-right:32px } }
.page{display:none}
.page.active{display:block;animation:fadeUp 420ms cubic-bezier(0.22,1,0.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){ .page.active{ animation:none } }

.page-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.page-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand-grad)}
.page-title-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;font-weight:500}
.page-header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header-row .page-title{margin-bottom:0}
.page-header-actions{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.page-header-actions .icon-btn{height:42px;width:42px;flex-shrink:0}

.stat-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(27,143,203,0.15),rgba(44,161,222,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);font-size:22px;flex-shrink:0;transition:transform 260ms cubic-bezier(0.34,1.56,0.64,1)}
.stat-card:hover .stat-icon{transform:scale(1.1) rotate(-6deg)}
.stat-icon.amber{background:linear-gradient(135deg,rgba(245,158,11,0.18),rgba(245,158,11,0.08));border-color:rgba(245,158,11,0.25);color:var(--stat-amber,#F59E0B)}
.stat-icon.blue{background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(37,99,235,0.08));border-color:rgba(37,99,235,0.25);color:var(--stat-blue,#2563EB)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-value{font-size:28px;font-weight:800;color:var(--text);line-height:1.1}
.stat-value.small{font-size:18px;line-height:1.2}
.stat-value .badge{margin-left:8px;vertical-align:middle;font-size:10px;padding:2px 8px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:28px}
.stat-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 6px rgba(0,0,0,0.04),0 10px 24px rgba(var(--shadow-rgb),0.08);position:relative;overflow:hidden;transition:transform 260ms cubic-bezier(0.34,1.4,0.64,1),box-shadow 260ms ease,border-color 260ms ease}

.btn-primary{background:var(--brand-grad);color:#fff;border:none;border-radius:var(--radius-btn);padding:10px 20px;font:600 13px 'Inter';box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.35);cursor:pointer;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1);display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.45)}
.btn-primary:active{transform:translateY(0) scale(0.98)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary i{transition:transform 220ms cubic-bezier(0.34,1.56,0.64,1)}
.btn-primary:hover i{transform:scale(1.15) rotate(-6deg)}
.btn-secondary{background:var(--panel-bg);color:var(--text);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-btn);padding:10px 20px;font:600 13px 'Inter';cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.btn-secondary:hover{background:color-mix(in srgb, var(--primary) 6%, var(--panel-bg));transform:translateY(-2px) scale(1.03);border-color:var(--primary)}
.btn-secondary:active{transform:translateY(0) scale(0.98)}
.btn-danger{background:rgba(239,68,68,0.10);color:var(--error);border:1px solid rgba(239,68,68,0.22);border-radius:var(--radius-btn);padding:8px 16px;font:600 12px 'Inter';cursor:pointer;transition:all 220ms cubic-bezier(0.34,1.4,0.64,1)}
.btn-danger:hover{background:rgba(239,68,68,0.20);transform:translateY(-2px) scale(1.03)}
.btn-danger:active{transform:translateY(0) scale(0.98)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.pending{color:#F59E0B;background:rgba(245,158,11,0.12)}
.badge.approved,.badge.active,.badge.graded{color:#2CA1DE;background:rgba(27,143,203,0.12)}
.badge.rejected,.badge.inactive{color:#EF4444;background:rgba(239,68,68,0.12)}
.badge.not_graded{color:var(--text-muted);background:rgba(148,163,184,0.16)}
.badge.reassigned{color:var(--text-muted);background:rgba(148,163,184,0.16)}
.badge.completed{color:#2563EB;background:rgba(37,99,235,0.12)}
.badge.locked{color:var(--text-muted);background:rgba(148,163,184,0.16);gap:5px}

.state-box{text-align:center;padding:48px 24px;color:var(--text-muted);font-size:14px}
.state-box i{font-size:36px;display:block;margin-bottom:10px;color:var(--text-muted);opacity:.7}
.state-box .cta{margin-top:14px}

.sk{position:relative;overflow:hidden;background:rgba(148,163,184,0.14);border-radius:8px;display:inline-block}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);background-size:200% 100%;animation:skShine 1.4s linear infinite}
@keyframes skShine{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{display:block;height:12px;border-radius:6px;margin:4px 0}
.sk-stat{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;display:flex;align-items:center;gap:16px}
.sk-stat .sk-circle{width:48px;height:48px;border-radius:14px}
.sk-stat .sk-meta{flex:1}
.ac-sk{border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);background:var(--panel-bg);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ac-sk .sk-circle{width:38px;height:38px;border-radius:50%}
.ac-sk .sk-meta{flex:1}

/* Modal system */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.45);backdrop-filter:blur(10px);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 200ms ease;overflow-y:auto}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
@keyframes popInCentered{from{opacity:0;transform:translate(-50%,-50%) scale(0.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1);max-height:90vh;max-height:90dvh;overflow-y:auto;position:relative}
.modal-card.wide{max-width:560px}
.modal-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.modal-msg{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.form-field{margin-bottom:16px}
.form-label{display:block;font:600 12.5px 'Inter';color:var(--text);margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Inter',sans-serif;transition:border-color 180ms ease,box-shadow 180ms ease}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15)}
.form-input.is-invalid{border-color:var(--error);background:var(--input-bg-err)}
.field-err{display:none;color:var(--error);font-size:11.5px;font-weight:600;margin-top:5px}
.field-err.show{display:block}

/* Bottom sheet modal system (mobile only) */
@keyframes slideUp{from{transform:translateY(100%);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-handle{display:none;width:44px;height:5px;border-radius:999px;background:var(--card-border-solid);margin:-8px auto 12px}
.sheet-head-sticky{position:sticky;top:calc(-20px - env(safe-area-inset-top,0px));background:var(--panel-bg);z-index:26;margin:-20px -18px 12px;padding:14px 18px 10px}
@media(max-width:768px){
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal-card:not(.no-sheet),
  .modal-card.wide:not(.no-sheet),
  .modal-card.sheet:not(.no-sheet){position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;border-radius:24px 24px 0 0;max-height:85vh;max-height:85dvh;overflow-y:auto;overflow-x:hidden;animation:slideUp 320ms cubic-bezier(0.22,1,0.36,1);padding:20px 18px calc(16px + env(safe-area-inset-bottom,0px));border-bottom:none}
  .modal-card:not(.no-sheet) .sheet-handle{display:block}
  .modal-card:not(.no-sheet) .modal-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--panel-bg);margin-top:14px;padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:26;border-top:1px solid var(--card-border-solid)}
  .modal-card:not(.no-sheet) .modal-actions .btn-primary{flex:1;justify-content:center}
  .modal-card.no-sheet{position:fixed;left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(100% - 32px);max-width:440px;border-radius:var(--radius-card);max-height:90vh;max-height:90dvh;animation:popInCentered 280ms cubic-bezier(0.34,1.5,0.64,1);padding:24px}
  .modal-card.no-sheet .sheet-handle{display:none}
}
@media(min-width:769px){
  .sheet-head-sticky{position:static;background:none;margin:0;padding:0}
}

/* Drawer (mobile nav) */
.drawer-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.35);backdrop-filter:blur(10px);z-index:95;opacity:0;visibility:hidden;transition:opacity 280ms ease,visibility 280ms ease}
.drawer-backdrop.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,320px);background:var(--panel-bg);border-left:1px solid var(--card-border);border-top-left-radius:24px;border-bottom-left-radius:24px;box-shadow:-20px 0 50px rgba(0,0,0,0.25);transform:translateX(110%);transition:transform 380ms cubic-bezier(0.34,1.2,0.64,1);z-index:96;display:flex;flex-direction:column;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.drawer-nav{display:flex;flex-direction:column;gap:8px;padding:14px 4px;overflow-y:auto;flex:1}
.drawer-nav .nav-item{justify-content:flex-start;width:100%;border-radius:999px;padding:12px 16px;min-height:0;font-size:14px;font-weight:500;background:var(--bg);border:none;color:var(--text);box-shadow:none;opacity:1 !important}
.drawer-nav .nav-item:hover,.drawer-nav .nav-item.active{background:var(--brand-grad);color:#fff}
.drawer-foot{padding-top:14px;border-top:1px solid var(--card-border-solid)}

/* Accordion cards */
.ac-list{display:flex;flex-direction:column;gap:12px}
.ac-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);overflow:hidden;transition:border-color 220ms ease,box-shadow 220ms ease,transform 220ms ease}
.ac-card.open{border-color:rgba(var(--shadow-rgb),0.35);box-shadow:0 10px 26px rgba(var(--shadow-rgb),0.14)}
.ac-card.clickable{cursor:pointer}
.ac-card.clickable:hover{transform:translateY(-2px);border-color:rgba(var(--shadow-rgb),0.3)}
.ac-card.muted{opacity:.68}
.ac-head{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.ac-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px 'Inter',sans-serif;flex-shrink:0;box-shadow:0 4px 12px rgba(var(--shadow-rgb),0.28)}
.ac-head-meta{min-width:0;flex:1}
.ac-head-title{font:700 14px 'Inter',sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-head-sub{font-size:12px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-chev{color:var(--primary);font-size:20px;transition:transform 260ms ease;flex-shrink:0}
.ac-card.open .ac-chev{transform:rotate(180deg)}
.ac-body{max-height:0;overflow:hidden;transition:max-height 320ms cubic-bezier(0.34,1.1,0.64,1);padding:0 18px}
.ac-card.open .ac-body{max-height:900px;padding-bottom:18px}
.ac-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}

/* Student card fact rows */
.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 0}
.fact-card{display:flex;align-items:flex-start;gap:10px;background:var(--neu-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:12px 14px;min-width:0}
.fact-card.full{grid-column:1 / -1}
.fact-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,rgba(27,143,203,0.15),rgba(44,161,222,0.10));border:1px solid rgba(var(--shadow-rgb),0.15);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.fact-meta{min-width:0}
.fact-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.fact-value{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;word-break:break-word}
@media(max-width:520px){.fact-grid{grid-template-columns:1fr}}

/* Profile-group collapsible (used for Past Students accordion wrapper) */
.profile-groups{display:flex;flex-direction:column;gap:16px}
.profile-group{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);overflow:hidden}
.pg-head{padding:16px 22px;display:flex;align-items:center;gap:10px;font-weight:700;color:var(--text);cursor:pointer;user-select:none}
.pg-head i.pg-icon{color:var(--primary);font-size:18px}
.pg-head .pg-chev{margin-left:auto;color:var(--primary);font-size:20px;font-weight:700;transition:transform 260ms ease}
.profile-group.open .pg-chev{transform:rotate(180deg)}
.pg-body{max-height:0;overflow:hidden;transition:max-height 320ms cubic-bezier(0.34,1.1,0.64,1);padding:0 22px}
.profile-group.open .pg-body{max-height:3000px;padding-bottom:20px}
@media(max-width:768px){
  .pg-head{padding:14px 18px}
}

.tab-surface-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);box-shadow:0 4px 6px rgba(0,0,0,0.04),0 10px 24px rgba(var(--shadow-rgb),0.08);padding:20px 22px}
@media(max-width:768px){
  .tab-surface-card{padding:16px 16px}
}
@media(max-width:480px){
  .tab-surface-card{padding:14px 12px;border-radius:16px}
}

@media (max-width: 768px){
  .topnav-strip-wrapper{display:none}
  .hamburger{display:flex}
  .topbar-shell{margin:8px 10px 0;padding-inline:0;max-width:none}
  .main{padding:clamp(16px,4vw,32px);padding-top:var(--main-top-offset,90px);padding-bottom:100px}
  .page-title{font-size:20px}
  .brand-name{font-size:13px}
}
@media (max-width: 480px){
  .top-right .logout-btn span{display:none}
}

/* Refresh overlay shimmer */
.refresh-host{position:relative}
.refresh-host.refreshing::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0.2),rgba(255,255,255,0.55),rgba(255,255,255,0.2));background-size:200% 100%;animation:refreshShimmer 1.4s linear infinite;pointer-events:none;z-index:5;border-radius:inherit}
.refresh-host.refreshing > *{opacity:.55;transition:opacity 200ms ease;pointer-events:none}
@keyframes refreshShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Button loading — mute button, three dots pulse in a traveling wave */
.btn.loading{
  background: var(--text-muted) !important;
  border-color: var(--text-muted) !important;
  color: var(--panel-bg) !important;
  opacity: .6;
  pointer-events: none;
}
.btn.loading .btn-icon,
.btn.loading .btn-text{
  display: none;
}
.btn-dots{
  display: none;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn.loading .btn-dots{
  display: inline-flex;
}
.btn-dots span{
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: dotPulse 1.2s ease-in-out infinite;
}
.btn-dots span:nth-child(1){ animation-delay: 0s; }
.btn-dots span:nth-child(2){ animation-delay: .15s; }
.btn-dots span:nth-child(3){ animation-delay: .3s; }
@keyframes dotPulse{
  0%, 80%, 100% { transform: scale(1);   opacity: .6; }
  40%           { transform: scale(1.6); opacity: 1;  }
}

/* ===== Stage 1: Force password-change gate ===== */
.pw-gate-backdrop{position:fixed;inset:0;background:rgba(10,20,16,0.55);backdrop-filter:blur(12px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.pw-gate-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:28px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,0.30);animation:popIn 280ms cubic-bezier(0.34,1.5,0.64,1)}
.pw-gate-icon{width:52px;height:52px;border-radius:14px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;margin-bottom:16px;box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.35)}

/* ===== Stage 1: My Students cards ===== */
.student-card-actions{display:flex;justify-content:flex-end;padding-top:2px}
.reassigned-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:rgba(148,163,184,0.16)}
.section-label{font:700 13px 'Inter';color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-label i{font-size:16px;color:var(--primary)}
.section-count{font:700 11px 'Inter';color:var(--primary);background:rgba(var(--shadow-rgb),0.10);padding:2px 9px;border-radius:999px}

/* ===== Stage 2: Student detail view ===== */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--panel-bg);border:1.5px solid var(--card-border-solid);color:var(--text);font:600 13px 'Inter';cursor:pointer;transition:all 200ms ease;margin-bottom:16px}
.back-btn:hover{border-color:var(--primary);transform:translateX(-2px)}
.back-btn i{font-size:17px}
.detail-header{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:22px 24px;margin-bottom:20px;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.06);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.detail-avatar{width:56px;height:56px;border-radius:50%;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;font:800 20px 'Inter';flex-shrink:0;box-shadow:0 6px 18px rgba(var(--shadow-rgb),0.30)}
.detail-header-meta{flex:1;min-width:0}
.detail-name{font-size:19px;font-weight:800;color:var(--text)}
.detail-sub{font-size:12.5px;color:var(--text-muted);margin-top:3px}
.detail-section-title{font:700 15px 'Inter';color:var(--text);margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.detail-section-title i{color:var(--primary);font-size:17px}
.detail-section-title:first-of-type{margin-top:0}
.visit-list{display:flex;flex-direction:column;gap:10px}
.visit-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(var(--shadow-rgb),0.05)}
.visit-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.visit-week-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font:700 11px 'Inter';color:var(--primary);background:rgba(var(--shadow-rgb),0.10)}
.visit-date{font:600 12px 'Inter';color:var(--text-muted)}
.visit-field-label{font:700 10.5px 'Inter';color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px;margin-bottom:3px}
.visit-field-text{font:500 13px 'Inter';color:var(--text);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.logweek-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.logweek-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;border-radius:12px;background:var(--bg);border:1.5px solid var(--card-border-solid);font:700 11px 'Inter';color:var(--text-muted)}
.logweek-chip.submitted{background:rgba(22,163,74,0.10);border-color:rgba(22,163,74,0.28);color:var(--success)}
.logweek-chip i{font-size:15px}
.form-textarea{width:100%;padding:11px 14px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:500 14px 'Inter',sans-serif;resize:vertical;min-height:90px;transition:border-color 180ms ease,box-shadow 180ms ease}
.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15)}
.form-textarea.is-invalid{border-color:var(--error);background:var(--input-bg-err)}

/* ===== Stage 3: Grading — report display (verbatim from student.html) ===== */
.grade-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font:800 12px 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.grade-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.grade-badge.gb-excellent,.grade-badge.gb-very-good{color:var(--success);background:rgba(22,163,74,0.12)}
.grade-badge.gb-good{color:var(--info);background:rgba(37,99,235,0.12)}
.grade-badge.gb-fair{color:var(--warning);background:rgba(245,158,11,0.12)}
.grade-badge.gb-poor{color:var(--error);background:rgba(239,68,68,0.12)}
.grade-total-card{background:linear-gradient(135deg,rgba(27,143,203,0.14),rgba(44,161,222,0.08));border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(var(--shadow-rgb),0.10)}
.grade-total-value{font-size:36px;font-weight:800;color:var(--text);line-height:1}
.grade-total-label{font:600 12px 'Inter',sans-serif;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.rubric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.rubric-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:14px 16px}
.rubric-label{font:600 11.5px 'Inter',sans-serif;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.rubric-score-row{display:flex;align-items:baseline;gap:4px;margin-bottom:8px}
.rubric-score{font:800 20px 'Inter',sans-serif;color:var(--text)}
.rubric-max{font:600 12px 'Inter',sans-serif;color:var(--text-muted)}
.rubric-bar-track{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.rubric-bar-fill{height:100%;border-radius:999px;background:var(--brand-grad)}
.grade-note-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:var(--radius-card);padding:18px 20px}
.grade-note-label{font:700 12px 'Inter',sans-serif;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.grade-note-text{font:500 13.5px 'Inter',sans-serif;color:var(--text);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

/* ===== Stage 3: Grading — input form variant of the rubric cards ===== */
.rubric-input-card{background:var(--panel-bg);border:1.5px solid var(--card-border-solid);border-radius:14px;padding:14px 16px}
.rubric-input-row{display:flex;align-items:center;gap:10px}
.rubric-input-row input[type="number"]{width:72px;padding:8px 10px;background:var(--input-bg);color:var(--text);border:1.5px solid var(--input-border);border-radius:var(--radius-input);font:700 15px 'Inter';text-align:center}
.rubric-input-row input[type="number"]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--shadow-rgb),0.15)}
.rubric-input-row input[type="number"].is-invalid{border-color:var(--error);background:var(--input-bg-err)}
.rubric-input-max{font:600 12px 'Inter';color:var(--text-muted);flex-shrink:0}
.rubric-input-slider{flex:1;accent-color:var(--primary)}
.grade-locked-note{display:flex;align-items:center;gap:8px;background:rgba(37,99,235,0.10);border:1px solid rgba(37,99,235,0.22);color:var(--info);border-radius:10px;padding:10px 12px;font:600 12.5px 'Inter';margin-bottom:16px}
.grade-locked-note i{font-size:16px;flex-shrink:0}
</style>

/* =============== HELPERS (verbatim from student.html) =============== */
function escHtml(s){ if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function emptyIcon(){ return '<i class="ph ph-minus" style="color:var(--text-muted);opacity:.4"></i>' }
function formatDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) }
function formatDateTime(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return escHtml(d); return dt.toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) }
function badge(status){ if(!status) return emptyIcon(); const s = String(status).toLowerCase(); return `<span class="badge ${escHtml(s)}">${escHtml(s.replace(/_/g,' '))}</span>` }
function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase() }
function computeAge(dob){
  if (!dob) return null
  const d = new Date(dob); if (isNaN(d)) return null
  const now = new Date()
  let age = now.getFullYear() - d.getFullYear()
  const m = now.getMonth() - d.getMonth()
  if (m < 0 || (m === 0 && now.getDate() < d.getDate())) age--
  return age >= 0 ? age : null
}
function isNetworkError(err){
  if (!err) return false
  const m = (err.message || String(err)).toLowerCase()
  return m.includes('failed to fetch') || m.includes('networkerror') || m.includes('load failed') || !navigator.onLine
}
function handleErr(err, fallback='Something went wrong'){
  if (isNetworkError(err)){ showToast('error','Check your internet connection'); return }
  showToast('error', err?.message || fallback)
}

/* ============ Button loading helper (traveling wave of 3 pulsing dots) ============
   Buttons must follow: <button class="btn-* btn"><i class="btn-icon …"></i><span class="btn-text">…</span><span class="btn-dots"><span></span><span></span><span></span></span></button> */
function setBtnLoading(btn, on){
  if (!btn) return
  if (on){
    if (btn.dataset.loadingOrig === undefined) btn.dataset.loadingOrig = btn.innerHTML
    const lockedWidth = btn.getBoundingClientRect().width
    btn.style.width = lockedWidth + 'px'
    btn.disabled = true
    btn.classList.add('loading')
  } else {
    btn.disabled = false
    btn.classList.remove('loading')
    btn.style.width = ''
    delete btn.dataset.loadingOrig
  }
}

/* =============== TOAST =============== */
function showToast(type, message){
  const duration = type === 'error' ? 6000 : 4000
  const wrap = document.getElementById('toastContainer')
  const t = document.createElement('div')
  t.className = `toast t-${type}`
  const icons = { success:'ph-check', error:'ph-x', info:'ph-info', warning:'ph-warning' }
  const ic = icons[type] || icons.info
  t.innerHTML = `<div class="toast-icon"><i class="ph-bold ${ic}"></i></div><div class="toast-text">${escHtml(message)}</div><button class="toast-close" aria-label="Close"><i class="ph ph-x"></i></button>`
  wrap.appendChild(t)
  requestAnimationFrame(() => t.classList.add('show'))

  const dismiss = () => { t.classList.add('hide'); setTimeout(() => t.remove(), 300) }
  t.querySelector('.toast-close').addEventListener('click', dismiss)
  let autoTimer = setTimeout(dismiss, duration)

  const DISMISS_THRESHOLD = 80
  let startX = 0, startY = 0, curX = 0, curY = 0, dragging = false

  function onDragStart(x, y){
    startX = x; startY = y; curX = 0; curY = 0
    dragging = true
    clearTimeout(autoTimer)
    t.classList.add('is-dragging')
    t.style.transition = 'none'
  }
  function onDragMove(x, y){
    if (!dragging) return
    curX = x - startX; curY = y - startY
    const effY = Math.min(curY, 0)
    const dist = Math.hypot(curX, effY)
    const opacity = Math.max(0, 1 - dist / (DISMISS_THRESHOLD * 1.5))
    t.style.transform = `translate(${curX}px, ${curY}px)`
    t.style.opacity = opacity
  }
  function onDragEnd(){
    if (!dragging) return
    dragging = false
    const effY = Math.min(curY, 0)
    const dist = Math.hypot(curX, effY)
    if (dist >= DISMISS_THRESHOLD){
      const scale = 2.5
      t.style.transition = 'transform 250ms ease, opacity 200ms ease'
      t.style.transform = `translate(${curX*scale}px, ${curY*scale}px)`
      t.style.opacity = '0'
      setTimeout(() => t.remove(), 260)
    } else {
      t.style.transition = 'transform 320ms cubic-bezier(0.34,1.56,0.64,1), opacity 200ms ease'
      t.style.transform = 'translate(0,0)'
      t.style.opacity = '1'
      t.classList.remove('is-dragging')
      autoTimer = setTimeout(dismiss, 3000)
    }
  }
  t.addEventListener('mousedown', e => {
    if (e.target.closest('.toast-close')) return
    onDragStart(e.clientX, e.clientY)
    const onMove = ev => onDragMove(ev.clientX, ev.clientY)
    const onUp = () => { onDragEnd(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp) }
    document.addEventListener('mousemove', onMove)
    document.addEventListener('mouseup', onUp)
  })
  t.addEventListener('touchstart', e => {
    const touch = e.touches[0]
    onDragStart(touch.clientX, touch.clientY)
  }, {passive:true})
  t.addEventListener('touchmove', e => {
    const touch = e.touches[0]
    onDragMove(touch.clientX, touch.clientY)
    e.preventDefault()
  }, {passive:false})
  t.addEventListener('touchend', onDragEnd)
  t.addEventListener('touchcancel', onDragEnd)
}

/* =============== MONDAY-ANCHORED WEEK NUMBERING (identical to admin.html / student.html) =============== */
function mondayOnOrBefore(date){
  const d = new Date(date)
  d.setHours(0,0,0,0)
  const day = d.getDay() // 0=Sun..6=Sat
  const diff = day === 0 ? 6 : day - 1 // days since most recent Monday
  d.setDate(d.getDate() - diff)
  return d
}
function weekNumberFor(startStr, todayDate){
  if (!startStr) return null
  const start = new Date(startStr + 'T00:00:00')
  if (isNaN(start)) return null
  const anchor = mondayOnOrBefore(start)
  const wk = Math.floor((todayDate - anchor) / (7*24*60*60*1000)) + 1
  return wk >= 1 ? wk : null
}
function getEffectiveToday(){
  if (demoCurrentDate){
    const d = new Date(demoCurrentDate + 'T00:00:00')
    if (!isNaN(d)) return d
  }
  return new Date()
}
function getProgramStatus(){
  if (!settingsCache || !settingsCache.siwes_start_date || !settingsCache.siwes_end_date) return null
  const today = getEffectiveToday(); today.setHours(0,0,0,0)
  const start = mondayOnOrBefore(new Date(settingsCache.siwes_start_date + 'T00:00:00'))
  const end = new Date(settingsCache.siwes_end_date + 'T00:00:00')
  return today < start ? 'Not Started' : (today > end ? 'Ended' : 'Active')
}

/* Fetch settings row (siwes_start_date, siwes_end_date, demo_current_date) and

  settingsCache = data || null
  demoCurrentDate = data?.demo_current_date || null
  return settingsCache
}

/* =============== MY STUDENTS (Stage 1) =============== */
async function loadMyStudents(){
  const host = document.getElementById('studentsRoot')
  if (!host || !currentSupervisorId) return
  if (!host.children.length || host.querySelector('.sk')) host.innerHTML = `<div class="section-label"><i class="ph-bold ph-users-three"></i> Current Students</div>${skCards(3)}`
  try {
    // Make sure week-number math is correct even if this tab loads before init()'s settings fetch resolves.
    if (!settingsCache) await loadSettings()

    const { data: assignments, error: asgErr } = await supabase
      .from('supervisor_assignments')
      .select('id, student_id, start_date, end_date, reassignment_note, students(id, matric_number, department, level, profiles(full_name))')
      .eq('supervisor_id', currentSupervisorId)
      .order('start_date', { ascending:false })
    if (asgErr) throw asgErr

    const rows = assignments || []
    const current = rows.filter(r => !r.end_date)
    const past = rows.filter(r => !!r.end_date)

    if (!current.length && !past.length){
      host.innerHTML = `<div class="state-box"><i class="ph ph-users-three"></i>You have no students assigned yet.</div>`
      return
    }

    const studentIds = rows.map(r => r.student_id).filter(Boolean)
    const uniqueStudentIds = [...new Set(studentIds)]

    // Batch-fetch everything needed per student in parallel, keyed by student_id.
    const [
      { data: placements, error: plcErr },
      { data: logCounts, error: logErr },
      { data: visits, error: visErr },
      { data: grades, error: gradeErr },
    ] = await Promise.all([
      supabase.from('placements').select('student_id, status, organization_id, organizations(name)').in('student_id', uniqueStudentIds).eq('status','approved'),
      supabase.from('logbook_entries').select('student_id').in('student_id', uniqueStudentIds),
      supabase.from('visits').select('student_id').in('student_id', uniqueStudentIds).eq('supervisor_id', currentSupervisorId),
      supabase.from('grades').select('student_id').in('student_id', uniqueStudentIds),
    ])
    if (plcErr) throw plcErr
    if (logErr) throw logErr
    if (visErr) throw visErr
    if (gradeErr) throw gradeErr

    const orgByStudent = {}
    ;(placements||[]).forEach(p => { orgByStudent[p.student_id] = p.organizations?.name || null })
    const logCountByStudent = {}
    ;(logCounts||[]).forEach(l => { logCountByStudent[l.student_id] = (logCountByStudent[l.student_id]||0) + 1 })
    const visitCountByStudent = {}
    ;(visits||[]).forEach(v => { visitCountByStudent[v.student_id] = (visitCountByStudent[v.student_id]||0) + 1 })
    const gradedSet = new Set((grades||[]).map(g => g.student_id))

    const weeksElapsed = settingsCache?.siwes_start_date
      ? Math.max(0, weekNumberFor(settingsCache.siwes_start_date, getEffectiveToday()) || 0)
      : 0

    function studentCard(row, isPast){
      const s = row.students
      const name = s?.profiles?.full_name || 'Unknown Student'
      const matric = s?.matric_number || '—'
      const dept = [s?.department, s?.level].filter(Boolean).join(' · ') || '—'
      const orgName = orgByStudent[row.student_id] || 'Not placed yet'
      const logSubmitted = logCountByStudent[row.student_id] || 0
      const visitCount = visitCountByStudent[row.student_id] || 0
      const isGraded = gradedSet.has(row.student_id)
      const gradeBadge = isGraded
        ? `<span class="badge graded"><i class="ph-bold ph-check-circle" style="font-size:10px"></i>Graded</span>`
        : `<span class="badge not_graded">Not Graded</span>`

      const rows = [
        factCard('ph-identification-badge','Matric Number', matric),
        factCard('ph-graduation-cap','Department / Level', dept),
        factCard('ph-buildings','Organization', orgName),
        factCard('ph-notebook','Logbook Compliance', `${logSubmitted} / ${weeksElapsed || 0} weeks submitted`),
        factCard('ph-map-pin-line','Supervision Visits', `${visitCount} visit${visitCount===1?'':'s'} logged`),
      ].join('')

      return `
        <div class="ac-card ${isPast ? 'muted' : 'clickable'}" data-student-id="${escHtml(row.student_id)}">
          <div class="ac-head">
            <div class="ac-avatar">${escHtml(initials(name))}</div>
            <div class="ac-head-meta">
              <div class="ac-head-title">${escHtml(name)}</div>
              <div class="ac-head-sub">${escHtml(matric)}</div>
            </div>
            ${isPast ? `<span class="reassigned-tag"><i class="ph-bold ph-arrow-u-down-left" style="font-size:10px"></i> Reassigned</span>` : gradeBadge}
          </div>
          <div style="padding:0 18px 16px">
            <div class="fact-grid">${rows}</div>
            ${!isPast ? `<div class="student-card-actions">${gradeBadge}</div>` : ''}
          </div>
        </div>`
    }

    let html = ''

    // SECTION 1 — Current Students (always visible)
    html += `<div class="section-label"><i class="ph-bold ph-users-three"></i> Current Students <span class="section-count">${current.length}</span></div>`
    if (!current.length){
      html += `<div class="state-box"><i class="ph ph-users-three"></i>You have no students assigned yet.</div>`
    } else {
      html += `<div class="ac-list" style="margin-bottom:28px">${current.map(r => studentCard(r, false)).join('')}</div>`
    }

    // SECTION 2 — Past Students (collapsed accordion, skipped entirely if empty)
    if (past.length){
      html += `
        <div class="profile-group" id="pastStudentsGroup">
          <div class="pg-head" id="pastStudentsHead">
            <i class="ph-bold ph-clock-counter-clockwise pg-icon"></i>
            <span>Past Students</span>
            <span class="section-count" style="margin-left:6px">${past.length}</span>
            <i class="ph-bold ph-caret-down pg-chev"></i>
          </div>
          <div class="pg-body"><div class="ac-list" style="padding-top:4px">${past.map(r => studentCard(r, true)).join('')}</div></div>
        </div>`
    }

    host.innerHTML = html

    const pastHead = document.getElementById('pastStudentsHead')
    if (pastHead) pastHead.addEventListener('click', () => document.getElementById('pastStudentsGroup').classList.toggle('open'))

    host.querySelectorAll('.ac-card.clickable').forEach(card => {
      card.addEventListener('click', () => openStudentDetail(card.dataset.studentId))
    })
  } catch (err){
    handleErr(err, 'Could not load your students')
    host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Could not load your students.</div>`
  }
}

/* =============== STUDENT DETAIL (Stage 2) =============== */
async function loadStudentDetail(){
  const host = document.getElementById('studentDetailRoot')
  if (!host || !currentDetailStudentId || !currentSupervisorId) return
  if (!host.children.length || host.querySelector('.sk')) host.innerHTML = `<div class="ac-sk"><div class="sk sk-circle"></div><div class="sk-meta"><span class="sk sk-line" style="width:45%"></span><span class="sk sk-line" style="width:65%"></span></div></div>${skCards(3)}`
  try {
    if (!settingsCache) await loadSettings()

    const [
      { data: student, error: stuErr },
      { data: asg, error: asgErr },
      { data: placement, error: plcErr },
      { data: logEntries, error: logErr },
      { data: visits, error: visErr },
      { data: grade, error: gradeErr },
    ] = await Promise.all([
      supabase.from('students').select('id, matric_number, department, level, profiles(full_name, email, phone)').eq('id', currentDetailStudentId).maybeSingle(),
      supabase.from('supervisor_assignments').select('id, start_date, end_date, reassignment_note').eq('student_id', currentDetailStudentId).eq('supervisor_id', currentSupervisorId).order('start_date', { ascending:false }).limit(1).maybeSingle(),
      supabase.from('placements').select('id, status, approved_date, organizations(name, address)').eq('student_id', currentDetailStudentId).eq('status','approved').maybeSingle(),
      supabase.from('logbook_entries').select('week_number, submitted_at').eq('student_id', currentDetailStudentId).order('week_number', { ascending:true }),
      supabase.from('visits').select('id, visit_date, week_number, progress_notes, remarks, created_at').eq('student_id', currentDetailStudentId).eq('supervisor_id', currentSupervisorId).order('visit_date', { ascending:false }),
      supabase.from('grades').select('id, total_score, classification').eq('student_id', currentDetailStudentId).maybeSingle(),
    ])
    if (stuErr) throw stuErr
    if (asgErr) throw asgErr
    if (plcErr) throw plcErr
    if (logErr) throw logErr
    if (visErr) throw visErr
    if (gradeErr) throw gradeErr

    if (!student){
      host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Student not found.</div>`
      return
    }

    const name = student.profiles?.full_name || 'Unknown Student'
    const matric = student.matric_number || '—'
    const dept = [student.department, student.level].filter(Boolean).join(' · ') || '—'
    const isPastAssignment = !!asg?.end_date
    const weeksElapsed = settingsCache?.siwes_start_date
      ? Math.max(0, weekNumberFor(settingsCache.siwes_start_date, getEffectiveToday()) || 0)
      : 0
    const submittedWeeks = new Set((logEntries||[]).map(l => l.week_number))

    /* ---- Header ---- */
    let html = `
      <div class="detail-header">
        <div class="detail-avatar">${escHtml(initials(name))}</div>
        <div class="detail-header-meta">
          <div class="detail-name">${escHtml(name)}</div>
          <div class="detail-sub">${escHtml(matric)} · ${escHtml(dept)}</div>
        </div>
        ${isPastAssignment ? `<span class="reassigned-tag"><i class="ph-bold ph-arrow-u-down-left" style="font-size:10px"></i> Reassigned</span>` : (grade ? `<span class="badge graded"><i class="ph-bold ph-check-circle" style="font-size:10px"></i>Graded</span>` : `<span class="badge not_graded">Not Graded</span>`)}
      </div>`

    /* ---- Placement / organization fact grid ---- */
    const factRows = [
      factCard('ph-buildings','Organization', placement?.organizations?.name || 'Not placed yet'),
      factCard('ph-envelope-simple','Email', student.profiles?.email || '—'),
      factCard('ph-phone','Phone', student.profiles?.phone || '—'),
    ]
    if (placement?.organizations?.address) factRows.push(factCard('ph-map-pin','Address', placement.organizations.address))
    if (asg?.reassignment_note) factRows.push(factCard('ph-note','Reassignment Note', asg.reassignment_note))
    html += `<div class="fact-grid" style="padding-top:0;margin-bottom:8px">${factRows.join('')}</div>`

    /* ---- Logbook compliance week grid ---- */
    html += `<div class="detail-section-title"><i class="ph-bold ph-notebook"></i> Logbook Compliance (${submittedWeeks.size} / ${weeksElapsed} weeks)</div>`
    if (weeksElapsed <= 0){
      html += `<div class="state-box" style="padding:24px"><i class="ph ph-notebook"></i>SIWES hasn't started yet — no weeks to report on.</div>`
    } else {
      let chips = ''
      for (let w = 1; w <= weeksElapsed; w++){
        const submitted = submittedWeeks.has(w)
        chips += `<div class="logweek-chip ${submitted ? 'submitted' : ''}"><i class="ph-bold ${submitted ? 'ph-check-circle' : 'ph-circle-dashed'}"></i>Wk ${w}</div>`
      }
      html += `<div class="logweek-grid" style="margin-bottom:8px">${chips}</div>`
    }

    /* ---- Visit history + log-a-visit form ---- */
    html += `<div class="detail-section-title"><i class="ph-bold ph-map-pin-line"></i> Supervision Visits (${(visits||[]).length})</div>`
    html += `
      <div class="tab-surface-card" style="margin-bottom:18px">
        <div class="form-field">
          <label class="form-label" for="visitDateInput">Visit Date</label>
          <input type="date" id="visitDateInput" class="form-input" />
          <div class="field-err" id="visitDateErr">Please choose a valid visit date.</div>
        </div>
        <div class="form-field">
          <label class="form-label" for="visitProgressInput">Progress Notes</label>
          <textarea id="visitProgressInput" class="form-textarea" placeholder="What the student has been working on…"></textarea>
        </div>
        <div class="form-field" style="margin-bottom:8px">
          <label class="form-label" for="visitRemarksInput">Remarks</label>
          <textarea id="visitRemarksInput" class="form-textarea" placeholder="Any additional remarks…"></textarea>
        </div>
        <div class="ac-actions">
          <button class="btn-primary btn" id="logVisitBtn">
            <i class="btn-icon ph-bold ph-plus-circle"></i><span class="btn-text">Log Visit</span>
            <span class="btn-dots"><span></span><span></span><span></span></span>
          </button>
        </div>
      </div>`

    if (!(visits||[]).length){
      html += `<div class="state-box"><i class="ph ph-map-pin-line"></i>No visits logged yet for this student.</div>`
    } else {
      html += `<div class="visit-list">` + visits.map(v => `
        <div class="visit-card">
          <div class="visit-card-head">
            <span class="visit-week-pill"><i class="ph-bold ph-calendar-blank" style="font-size:11px"></i> Week ${v.week_number}</span>
            <span class="visit-date">${formatDate(v.visit_date)}</span>
          </div>
          ${v.progress_notes ? `<div class="visit-field-label">Progress Notes</div><div class="visit-field-text">${escHtml(v.progress_notes)}</div>` : ''}
          ${v.remarks ? `<div class="visit-field-label">Remarks</div><div class="visit-field-text">${escHtml(v.remarks)}</div>` : ''}
        </div>`).join('') + `</div>`
    }

    /* ---- Grade (Stage 3) ---- */
    html += `<div class="detail-section-title"><i class="ph-bold ph-medal"></i> Grade</div>`
    html += grade ? renderGradeReport(grade) : renderGradeForm()

    host.innerHTML = html

    clearOnInput(host, [['visitDateInput','visitDateErr']])
    const logBtn = document.getElementById('logVisitBtn')
    if (logBtn) logBtn.addEventListener('click', () => submitVisit(logBtn))

    if (!grade) wireGradeForm(host)
  } catch (err){
    handleErr(err, 'Could not load student detail')
    host.innerHTML = `<div class="state-box"><i class="ph ph-warning-circle"></i>Could not load student detail.</div>`
  }
}

/* Visits are backdatable: week_number is always computed from the entered
   visit date, never from getEffectiveToday() — a supervisor may log a visit
   for a week that has already passed. */
async function submitVisit(btn){
  const dateInput = document.getElementById('visitDateInput')
  const progressInput = document.getElementById('visitProgressInput')
  const remarksInput = document.getElementById('visitRemarksInput')
  const dateVal = dateInput?.value

  if (!dateVal){ fieldInvalid('visitDateInput','visitDateErr', true); return }
  if (!settingsCache?.siwes_start_date){
    showToast('error', 'SIWES start date is not configured yet.')
    return
  }
  const visitWeek = weekNumberFor(settingsCache.siwes_start_date, new Date(dateVal + 'T00:00:00'))
  if (visitWeek === null){
    fieldInvalid('visitDateInput','visitDateErr', true)
    showToast('error', 'Visit date is before the SIWES program start.')
    return
  }

  setBtnLoading(btn, true)
  try {
    const { error } = await supabase.from('visits').insert({
      student_id: currentDetailStudentId,
      supervisor_id: currentSupervisorId,
      visit_date: dateVal,
      week_number: visitWeek,
      progress_notes: progressInput?.value?.trim() || null,
      remarks: remarksInput?.value?.trim() || null,
    })
    if (error) throw error
    showToast('success', `Visit logged for Week ${visitWeek}.`)
    await loadStudentDetail()
  } catch (err){
    handleErr(err, 'Could not log the visit')
    setBtnLoading(btn, false)
  }
}

/* =============== GRADE (Stage 3) =============== */
/* RUBRIC_FIELDS / GRADE_CLASS_CSS / report markup are kept identical to
   student.html's read-only grade view so both apps always agree on what a
   grade "looks like". Grades are insert-only from the supervisor's side —
   student_id is unique in the grades table, so once a grade exists this
   student is shown the report only, never the form again. */
const RUBRIC_FIELDS = [
  { key:'punctuality_score', max:15, label:'Punctuality & Attendance' },
  { key:'logbook_score',     max:20, label:'Logbook Quality' },
  { key:'skill_score',       max:30, label:'Practical Skill / Performance' },
  { key:'conduct_score',     max:15, label:'Conduct & Discipline' },
  { key:'initiative_score',  max:10, label:'Initiative & Attentiveness' },
  { key:'visits_score',      max:10, label:"Supervisor's Overall Visit Impression" },
]
const GRADE_CLASS_CSS = {
  'Excellent':'gb-excellent', 'Very Good':'gb-very-good', 'Good':'gb-good',
  'Fair':'gb-fair', 'Poor':'gb-poor',
}
function classifyScore(total){
  if (total >= 70) return 'Excellent'
  if (total >= 60) return 'Very Good'
  if (total >= 50) return 'Good'
  if (total >= 40) return 'Fair'
  return 'Poor'
}

function renderGradeReport(grade){
  const badgeCls = GRADE_CLASS_CSS[grade.classification] || 'gb-good'
  return `
    <div class="grade-total-card">
      <div>
        <div class="grade-total-value">${Number(grade.total_score ?? 0)}<span style="font-size:18px;color:var(--text-muted);font-weight:600">/100</span></div>
        <div class="grade-total-label">Total Score</div>
      </div>
      <span class="grade-badge ${badgeCls}">${escHtml(grade.classification || '—')}</span>
    </div>
    <div class="rubric-grid">${RUBRIC_FIELDS.map(f => {
      const v = Number(grade[f.key] ?? 0)
      const pct = Math.max(0, Math.min(100, (v / f.max) * 100))
      return `<div class="rubric-card">
        <div class="rubric-label">${escHtml(f.label)}</div>
        <div class="rubric-score-row"><span class="rubric-score">${v}</span><span class="rubric-max">/ ${f.max}</span></div>
        <div class="rubric-bar-track"><div class="rubric-bar-fill" style="width:${pct}%"></div></div>
      </div>`
    }).join('')}</div>
    <div class="grade-note-card">
      <div class="grade-note-label">Supervisor's Assessment Note</div>
      <div class="grade-note-text">${escHtml(grade.assessment_note || '')}</div>
    </div>`
}

function renderGradeForm(){
  const inputs = RUBRIC_FIELDS.map(f => `
    <div class="rubric-input-card">
      <div class="rubric-label">${escHtml(f.label)}</div>
      <div class="rubric-input-row">
        <input type="number" id="grade_${f.key}" class="rubric-score-input" data-key="${f.key}" data-max="${f.max}" min="0" max="${f.max}" step="1" value="0" />
        <span class="rubric-input-max">/ ${f.max}</span>
        <input type="range" class="rubric-input-slider" data-linked="grade_${f.key}" min="0" max="${f.max}" step="1" value="0" />
      </div>
      <div class="field-err" id="grade_${f.key}_err">Enter a value between 0 and ${f.max}.</div>
    </div>`).join('')

  return `
    <div class="tab-surface-card">
      <div class="grade-total-card" id="gradeLivePreview">
        <div>
          <div class="grade-total-value" id="gradeLiveTotal">0<span style="font-size:18px;color:var(--text-muted);font-weight:600">/100</span></div>
          <div class="grade-total-label">Total Score (live)</div>
        </div>
        <span class="grade-badge gb-poor" id="gradeLiveBadge">Poor</span>
      </div>
      <div class="rubric-grid">${inputs}</div>
      <div class="form-field">
        <label class="form-label" for="gradeNoteInput">Assessment Note</label>
        <textarea id="gradeNoteInput" class="form-textarea" placeholder="Overall comments on the student's SIWES performance…"></textarea>
        <div class="field-err" id="gradeNoteErr">An assessment note is required.</div>
      </div>
      <div class="grade-locked-note"><i class="ph-bold ph-info"></i> Grades cannot be edited or deleted once submitted — double-check scores before submitting.</div>
      <div class="ac-actions">
        <button class="btn-primary btn" id="submitGradeBtn">
          <i class="btn-icon ph-bold ph-medal"></i><span class="btn-text">Submit Grade</span>
          <span class="btn-dots"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>`
}

function wireGradeForm(scope){
  const total = () => RUBRIC_FIELDS.reduce((sum, f) => sum + (parseFloat(scope.querySelector('#grade_'+f.key)?.value) || 0), 0)
  function refreshPreview(){
    const t = total()
    const cls = classifyScore(t)
    const totalEl = scope.querySelector('#gradeLiveTotal')
    const badgeEl = scope.querySelector('#gradeLiveBadge')
    if (totalEl) totalEl.innerHTML = `${t}<span style="font-size:18px;color:var(--text-muted);font-weight:600">/100</span>`
    if (badgeEl){ badgeEl.textContent = cls; badgeEl.className = 'grade-badge ' + (GRADE_CLASS_CSS[cls] || 'gb-poor') }
  }
  RUBRIC_FIELDS.forEach(f => {
    const numInput = scope.querySelector('#grade_'+f.key)
    const slider = scope.querySelector(`.rubric-input-slider[data-linked="grade_${f.key}"]`)
    if (!numInput || !slider) return
    const sync = (val) => {
      let v = parseFloat(val); if (isNaN(v)) v = 0
      v = Math.max(0, Math.min(f.max, v))
      numInput.value = v; slider.value = v
      fieldInvalid('grade_'+f.key, 'grade_'+f.key+'_err', false)
      refreshPreview()
    }
    numInput.addEventListener('input', () => sync(numInput.value))
    slider.addEventListener('input', () => sync(slider.value))
  })
  const noteInput = scope.querySelector('#gradeNoteInput')
  if (noteInput) noteInput.addEventListener('input', () => fieldInvalid('gradeNoteInput','gradeNoteErr', false))

  const submitBtn = scope.querySelector('#submitGradeBtn')
  if (submitBtn) submitBtn.addEventListener('click', () => submitGrade(submitBtn, scope))
}

async function submitGrade(btn, scope){
  let bad = false
  const scores = {}
  RUBRIC_FIELDS.forEach(f => {
    const input = scope.querySelector('#grade_'+f.key)
    const raw = parseFloat(input?.value)
    const v = isNaN(raw) ? NaN : raw
    if (isNaN(v) || v < 0 || v > f.max){ fieldInvalid('grade_'+f.key, 'grade_'+f.key+'_err', true); bad = true }
    else scores[f.key] = v
  })
  const noteInput = scope.querySelector('#gradeNoteInput')
  const note = noteInput?.value?.trim() || ''
  if (!note){ fieldInvalid('gradeNoteInput','gradeNoteErr', true); bad = true }
  if (bad) return

  const totalScore = RUBRIC_FIELDS.reduce((sum, f) => sum + scores[f.key], 0)
  const classification = classifyScore(totalScore)

  const ok = await showConfirm(
    'Submit Grade?',
    `Total score: ${totalScore}/100 (${classification}). This cannot be edited or deleted once submitted. Continue?`,
    'Submit Grade', 'no-sheet'
  )
  if (!ok) return

  setBtnLoading(btn, true)
  try {
    const { error } = await supabase.from('grades').insert({
      student_id: currentDetailStudentId,
      supervisor_id: currentSupervisorId,
      punctuality_score: scores.punctuality_score,
      logbook_score: scores.logbook_score,
      skill_score: scores.skill_score,
      conduct_score: scores.conduct_score,
      initiative_score: scores.initiative_score,
      visits_score: scores.visits_score,
      total_score: totalScore,
      classification,
      assessment_note: note,
    })
    if (error) throw error
    showToast('success', `Grade submitted: ${classification} (${totalScore}/100).`)
    await loadStudentDetail()
    // Keep the My Students list's badges in sync without forcing a full refetch on next visit.
    if (document.getElementById('studentsRoot')?.children.length) loadMyStudents()
  } catch (err){
    handleErr(err, 'Could not submit the grade')
    setBtnLoading(btn, false)
  }
}

/* =============== FORCED PASSWORD-CHANGE GATE =============== */
function showForcedPasswordGate(){
  return new Promise(resolve => {
    const bd = document.createElement('div')
    bd.className = 'pw-gate-backdrop'
    bd.innerHTML = `
      <div class="pw-gate-card">
        <div class="pw-gate-icon"><i class="ph-bold ph-lock-key"></i></div>
        <div class="modal-title">Set a new password</div>
        <div class="modal-msg">For security, you must set a new password before continuing to your dashboard.</div>
        <div class="form-field">
          <label class="form-label" for="pwGateNew">New Password</label>
          <input type="password" id="pwGateNew" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" />
          <div class="field-err" id="pwGateNewErr">Password must be at least 6 characters.</div>
        </div>
        <div class="form-field" style="margin-bottom:8px">
          <label class="form-label" for="pwGateConfirm">Confirm Password</label>
          <input type="password" id="pwGateConfirm" class="form-input" placeholder="Re-enter password" autocomplete="new-password" />
          <div class="field-err" id="pwGateConfirmErr">Passwords do not match.</div>
        </div>
        <div class="modal-actions" style="justify-content:stretch;margin-top:18px">
          <button class="btn-primary btn" id="pwGateSubmit" style="width:100%;justify-content:center">
            <i class="btn-icon ph-bold ph-check"></i><span class="btn-text">Set Password &amp; Continue</span>
            <span class="btn-dots"><span></span><span></span><span></span></span>
          </button>
        </div>
      </div>`
    document.body.appendChild(bd)
    clearOnInput(bd, [['pwGateNew','pwGateNewErr'],['pwGateConfirm','pwGateConfirmErr']])

    const submitBtn = bd.querySelector('#pwGateSubmit')
    submitBtn.addEventListener('click', async () => {
      const pw = bd.querySelector('#pwGateNew').value
      const confirmPw = bd.querySelector('#pwGateConfirm').value
      let bad = false
      if (!pw || pw.length < 6){ fieldInvalid('pwGateNew','pwGateNewErr', true); bad = true }
      if (pw !== confirmPw){ fieldInvalid('pwGateConfirm','pwGateConfirmErr', true); bad = true }
      if (bad) return

      setBtnLoading(submitBtn, true)
      try {
        const { error: updateErr } = await supabase.auth.updateUser({ password: pw })
        if (updateErr) throw updateErr
        const { error: profileErr } = await supabase.from('profiles').update({ must_change_password: false }).eq('id', currentUser.id)
        if (profileErr) throw profileErr
        showToast('success', 'Password set. Welcome!')
        bd.remove()
        resolve()
      } catch (err){
        handleErr(err, 'Could not set your password')
        setBtnLoading(submitBtn, false)
      }
    })
  })
}

/* =============== AUTH =============== */
async function confirmLogout(){
  const ok = await showConfirm('Log Out', "Are you sure you want to log out? You'll need to sign in again to access the dashboard.", 'Log Out', 'no-sheet')
  if (ok) doLogout()
}
async function doLogout(){ await supabase.auth.signOut(); window.location.href='index.html' }

/* =============== INIT =============== */
async function init(){
  renderNav()
  try {
    const savedTab = localStorage.getItem('siwes-supervisor-tab')
    if (savedTab && document.getElementById('page-'+savedTab)) switchTab(savedTab)
  } catch(e){}
  initMedBg()
  document.getElementById('menuBtn').addEventListener('click', openDrawer)
  document.getElementById('drawerClose').addEventListener('click', closeDrawer)
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer)
  document.getElementById('logoutBtn').addEventListener('click', confirmLogout)
  document.getElementById('logoutBtnDrawer').addEventListener('click', confirmLogout)

  const { data: { session } } = await supabase.auth.getSession()
  if (!session){ window.location.href='index.html'; return }
  currentUser = session.user

  const { data: profile, error: profileErr } = await supabase
    .from('profiles').select('role, full_name, must_change_password').eq('id', currentUser.id).maybeSingle()
  if (profileErr || !profile || profile.role !== 'supervisor'){
    // Not a supervisor (or no profile row) — sign out so no partially-authed state lingers.
    await supabase.auth.signOut()
    window.location.href='index.html'
    return
  }

  if (profile.must_change_password){
    // Unlike student.html (which bounces to index.html for this), supervisor.html
    // owns its own forced-reset gate per spec: a modal that cannot be dismissed
    // until a new password is set, then flips must_change_password to false.
    await showForcedPasswordGate()
  }

  currentSupervisorId = currentUser.id
  setWelcomeMessages(profile.full_name); setupIslandProfile(profile.full_name)

  document.getElementById('authScreen').style.display='none'
  document.getElementById('app').style.display='block'
  updateMainTopOffset()

  document.getElementById('refreshStudentsBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('studentsRoot', loadMyStudents, 'Students') })
  document.getElementById('refreshDetailBtn').addEventListener('click', e => { spinBtn(e.currentTarget); refreshWithOverlay('studentDetailRoot', loadStudentDetail, 'Student detail') })
  document.getElementById('detailBackBtn').addEventListener('click', () => {
    currentDetailStudentId = null
    const savedTab = (() => { try { return localStorage.getItem('siwes-supervisor-tab') } catch(e){ return null } })()
    switchTab(savedTab && document.getElementById('page-'+savedTab) ? savedTab : 'students')
  })

  try { await loadSettings() } catch (err){ handleErr(err, 'Could not load SIWES settings') }

  if (document.getElementById('page-students').classList.contains('active')) loadMyStudents()
}

/* =============== HOVER + ARROW-KEY SCROLL =============== */
;(function setupHoverArrowScroll(){
  const SCROLL_STEP = 80
  let hoveredPanel = null
  const navScrollEl = () => document.getElementById('islandNavList')
  const navHoverTarget = document.getElementById('islandNav')
  const mainHoverTarget = document.querySelector('main.main')

  if (navHoverTarget){
    navHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'nav' })
    navHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'nav') hoveredPanel = null })
    navHoverTarget.addEventListener('wheel', (e) => {
      const scrollEl = navScrollEl()
      if (!scrollEl) return
      scrollEl.scrollTop += e.deltaY
      e.preventDefault()
    }, { passive:false })
  }
  if (mainHoverTarget){
    mainHoverTarget.addEventListener('mouseenter', () => { hoveredPanel = 'main' })
    mainHoverTarget.addEventListener('mouseleave', () => { if (hoveredPanel === 'main') hoveredPanel = null })
  }
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return
    if (!hoveredPanel) return
    const tag = (document.activeElement && document.activeElement.tagName) || ''
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return
    const delta = e.key === 'ArrowDown' ? SCROLL_STEP : -SCROLL_STEP
    if (hoveredPanel === 'nav' && navScrollEl()){
      navScrollEl().scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    } else if (hoveredPanel === 'main'){
      window.scrollBy({ top: delta, behavior: 'smooth' })
      e.preventDefault()
    }
  })
})()
